[package]
name = "surmuni"
version = "0.0.4"
description = "Surmuni — Cross-platform Retro & Modern Audio Player in Rust"
authors = ["Surmuni Contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "surmuni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.19"
tauri-plugin-dialog = "2"
symphonia = { version = "0.5", features = ["mp3", "isomp4", "alac", "flac", "vorbis"] }
rustysynth = "1.3"
midly = "0.5"
biquad = "0.4"
xmrs = "0.15"
xmrsplayer = "0.15"
zip = "2"
image = "0.25"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
microfft = "0.6"
lofty = "0.25.4"
rubato = "5.0.1"
ureq = "3.5.0"
rustls = "0.23.46"
webpki-roots = "1.0.10"
dirs = "7.0.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
