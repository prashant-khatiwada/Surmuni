<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MilkDrop 2 Visualizer — Surmuni</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }
      body {
        background: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #vis-canvas {
        flex: 1;
        width: 100%;
        height: calc(100% - 36px);
        display: block;
        background: #000;
      }
      .vis-hud {
        height: 36px;
        background: #111116;
        border-top: 1px solid #22222c;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        color: #00e5ff;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
      }
      .hud-btn {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
      }
      .hud-btn:hover {
        background: #1d4ed8;
      }
      .preset-title {
        color: #94a3b8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 70%;
      }
      .preset-title strong {
        color: #00e5ff;
      }
    </style>
  </head>
  <body>
    <canvas id="vis-canvas"></canvas>
    <div class="vis-hud">
      <button class="hud-btn" id="btn-next-preset">⚡ NEXT PRESET [SPACE]</button>
      <div class="preset-title" id="preset-title">Preset: <strong>Loading presets...</strong></div>
    </div>

    <script type="module" src="/src/visualizer_window.ts"></script>
  </body>
</html>
